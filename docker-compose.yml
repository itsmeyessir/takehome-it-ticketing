services:
  postgres:
    image: postgres:16-alpine
    container_name: takehome-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: takehome
      POSTGRES_PASSWORD: takehome_secret
      POSTGRES_DB: takehome
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
